<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>VocabTrainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow-x: hidden;
    }
    #app { min-height: 100dvh; display: flex; flex-direction: column; }

    /* ─── Responsive: ensure touch targets ≥ 44px ─── */
    button, [role="button"], a, input, select, textarea {
      min-height: 44px;
    }
    input, select, textarea {
      font-size: 16px !important; /* prevents iOS zoom on focus */
    }

    /* ─── Responsive: full-width inputs on mobile ─── */
    @media (max-width: 767px) {
      input[type="text"], input[type="range"], select, textarea {
        width: 100% !important;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-CN3FLb1Y.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
